<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification</title><link rel="stylesheet" href="/verify/static/verify.css"></head><body><header><h1>Sovereign AI Verification</h1><p>Local Processing Only · temporary developer interface.</p></header><main>
<section><h2>System status</h2><button id="refresh-status">Refresh</button><div id="system-progress" class="progress"></div><div id="system-response" class="response"></div></section>
<section><h2>Documents</h2><p id="current">No document selected.</p><button id="refresh-documents">Refresh list</button><div id="documents-progress" class="progress"></div><div id="documents-response" class="response"></div></section>
<section><h2>Upload and processing</h2><input id="file" type="file" accept=".pdf,.txt,.docx,.png,.jpg,.jpeg"><button id="upload">Upload and process</button><div id="upload-progress" class="progress"></div><div id="upload-response" class="response"></div></section>
<section><h2>OCR / extraction reliability</h2><button id="refresh-extraction">Refresh extraction</button><div id="extraction-progress" class="progress"></div><div id="extraction-response" class="response"></div></section>
<section><h2>User confirmation</h2><div id="confirmation-controls"></div><div id="confirmation-progress" class="progress"></div><div id="confirmation-response" class="response"></div></section>
<section><h2>Vision</h2><button id="analyze">Analyze image</button><input id="vision-question" placeholder="What bearing temperature is visible?"><button id="ask-vision">Ask image</button><div id="vision-progress" class="progress"></div><div id="vision-response" class="response"></div></section>
<section><h2>Knowledge indexing</h2><button id="index">Index current document</button><div id="index-progress" class="progress"></div><div id="index-response" class="response"></div></section>
<section><h2>RAG question</h2><input id="rag-question" placeholder="Ask the local knowledge base"><button id="ask-rag">Ask RAG</button><div id="rag-progress" class="progress"></div><div id="rag-response" class="response"></div></section>
<section><h2>Agent</h2><textarea id="agent-goal" placeholder="Find readings and calculate their average."></textarea><button id="run-agent">Run agent</button><div id="agent-progress" class="progress"></div><div id="agent-response" class="response"></div></section>
<section><h2>Job inspector</h2><input id="job-id" placeholder="Server-issued job ID"><button id="inspect-job">Inspect job</button><div id="jobs-progress" class="progress"></div><div id="jobs-response" class="response"></div></section>
<details><summary>Global raw request log</summary><pre id="raw"></pre></details></main><script src="/verify/static/verify.js"></script></body></html>
